[workspace]
# Existing platform/application crates are imported in subsequent reviewed changes.
members = ["crates/xunstack-core"]
resolver = "2"

[workspace.package]
version = "0.3.0-alpha.1"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
regex = "1"
semver = "1"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
